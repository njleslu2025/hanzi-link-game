<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日快乐</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #170d18;
        --panel: rgba(55, 24, 48, 0.62);
        --panel-strong: rgba(72, 29, 61, 0.78);
        --ink: #fff7fb;
        --muted: #f0c8d9;
        --soft: rgba(255, 203, 226, 0.18);
        --accent: #ff8fb9;
        --accent-strong: #ff6fa6;
        --gold: #ffd9a6;
        --border: rgba(255, 206, 229, 0.24);
        font-family:
          "Avenir Next",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 14% 12%, rgba(255, 143, 185, 0.32), transparent 26rem),
          radial-gradient(circle at 86% 8%, rgba(255, 218, 239, 0.16), transparent 22rem),
          radial-gradient(circle at 52% 88%, rgba(255, 102, 165, 0.22), transparent 30rem),
          linear-gradient(180deg, #1a101c 0%, #2b142b 48%, #3a1731 100%);
        overflow-x: hidden;
      }

      body.lightbox-open {
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 12% 22%, rgba(255, 255, 255, 0.75) 0 0.08rem, transparent 0.12rem),
          radial-gradient(circle at 30% 12%, rgba(255, 213, 232, 0.7) 0 0.07rem, transparent 0.11rem),
          radial-gradient(circle at 62% 18%, rgba(255, 255, 255, 0.66) 0 0.08rem, transparent 0.12rem),
          radial-gradient(circle at 84% 38%, rgba(255, 220, 238, 0.72) 0 0.08rem, transparent 0.12rem),
          radial-gradient(circle at 22% 74%, rgba(255, 255, 255, 0.56) 0 0.07rem, transparent 0.11rem),
          radial-gradient(circle at 70% 82%, rgba(255, 225, 241, 0.7) 0 0.08rem, transparent 0.12rem);
        opacity: 0.72;
        animation: twinkle 7s ease-in-out infinite;
      }

      a {
        color: inherit;
      }

      button {
        font: inherit;
      }

      .page {
        position: relative;
        width: min(1080px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .hero {
        position: relative;
        min-height: min(760px, calc(100vh - 2rem));
        display: grid;
        align-content: center;
        gap: 2rem;
        overflow: hidden;
        border: 1px solid rgba(255, 220, 237, 0.2);
        border-radius: 2rem;
        padding: clamp(2rem, 6vw, 4.2rem);
        background:
          linear-gradient(90deg, rgba(21, 9, 24, 0.78), rgba(43, 17, 40, 0.48) 48%, rgba(43, 17, 40, 0.2)),
          url("./photos/06/06-001.jpg") center / cover;
        box-shadow: 0 28px 72px rgba(24, 8, 28, 0.34);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(23, 13, 24, 0.12), rgba(23, 13, 24, 0.7)),
          radial-gradient(circle at 26% 22%, rgba(255, 177, 211, 0.34), transparent 24rem);
      }

      .hero-copy,
      .hero .music-card {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        margin: 0 0 0.8rem;
        color: #ffd5e6;
        font-size: 0.82rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-family:
          "Iowan Old Style",
          "Songti SC",
          "Noto Serif SC",
          "Times New Roman",
          serif;
        letter-spacing: 0;
      }

      h1 {
        max-width: 12ch;
        font-size: clamp(3.4rem, 12vw, 8.4rem);
        line-height: 0.9;
        text-shadow:
          0 0 22px rgba(255, 152, 195, 0.32),
          0 0 60px rgba(255, 152, 195, 0.16);
      }

      .hero-copy {
        max-width: 38rem;
      }

      .subtitle {
        max-width: 34rem;
        margin: 1.2rem 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.6vw, 1.28rem);
        line-height: 1.9;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        margin-top: 2rem;
      }

      .button {
        min-height: 3.25rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.85rem 1.2rem;
        color: #fffaf7;
        background: rgba(63, 28, 58, 0.72);
        box-shadow:
          0 18px 34px rgba(25, 9, 26, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        cursor: pointer;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      .button.primary {
        border-color: rgba(255, 184, 214, 0.42);
        background: linear-gradient(135deg, #ff79b1 0%, #ffb2d2 100%);
        box-shadow:
          0 18px 34px rgba(255, 118, 176, 0.26),
          0 0 28px rgba(255, 165, 205, 0.18);
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow:
          0 22px 42px rgba(25, 9, 26, 0.3),
          0 0 28px rgba(255, 165, 205, 0.18);
      }

      .music-card {
        width: min(31rem, 100%);
        border: 1px solid var(--border);
        border-radius: 1.4rem;
        padding: 1.1rem;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 42%),
          var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 52px rgba(24, 8, 28, 0.32);
      }

      .music-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.85rem;
      }

      .disc {
        width: 3.15rem;
        height: 3.15rem;
        border-radius: 50%;
        background:
          radial-gradient(circle, #3a1730 0 22%, transparent 23%),
          conic-gradient(from 90deg, #ffd4e8, #ff77b0, #ffe2ef, #ff8fbd, #ffd4e8);
        box-shadow: 0 0 24px rgba(255, 149, 196, 0.25);
      }

      .disc.playing {
        animation: spin 4.5s linear infinite;
      }

      .music-title {
        margin: 0;
        font-weight: 800;
      }

      .music-state {
        margin: 0.2rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .music-toggle {
        min-width: 4.4rem;
      }

      .section {
        margin-top: clamp(3rem, 8vw, 5rem);
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.2rem;
      }

      .section-heading p {
        margin: 0.35rem 0 0;
        color: var(--muted);
      }

      .gallery-summary {
        min-width: 7.4rem;
        border: 1px solid rgba(255, 212, 232, 0.24);
        border-radius: 999px;
        padding: 0.72rem 1rem;
        background: rgba(63, 28, 58, 0.58);
        color: #ffe2ef;
        font-weight: 800;
        text-align: center;
        box-shadow: 0 16px 30px rgba(24, 8, 28, 0.18);
      }

      .month-list {
        display: grid;
        gap: 1.2rem;
      }

      .month-block {
        border: 1px solid rgba(255, 212, 232, 0.18);
        border-radius: 1.45rem;
        padding: clamp(0.8rem, 2.2vw, 1.2rem);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 30%),
          rgba(69, 26, 58, 0.48);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 52px rgba(24, 8, 28, 0.24);
      }

      .month-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.9rem;
      }

      .month-heading h3 {
        font-size: clamp(1.55rem, 4vw, 2.25rem);
      }

      .month-heading p {
        margin: 0.3rem 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .month-count {
        flex: 0 0 auto;
        color: #ffe0ee;
        font-weight: 800;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.7rem;
      }

      .photo-card {
        position: relative;
        min-width: 0;
        border: 0;
        border-radius: 1rem;
        padding: 0;
        aspect-ratio: 1;
        overflow: hidden;
        background: rgba(255, 229, 240, 0.12);
        box-shadow: 0 14px 30px rgba(24, 8, 28, 0.22);
        cursor: pointer;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          filter 180ms ease;
      }

      .photo-card:first-child {
        grid-column: span 2;
        grid-row: span 2;
      }

      .photo-card:hover {
        transform: translateY(-2px);
        filter: saturate(1.08);
        box-shadow:
          0 20px 40px rgba(24, 8, 28, 0.3),
          0 0 28px rgba(255, 151, 195, 0.2);
      }

      .photo-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .photo-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 56%, rgba(28, 9, 30, 0.42));
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .photo-card:hover::after {
        opacity: 1;
      }

      .letter {
        max-width: 46rem;
        margin: 3.2rem auto 0;
        text-align: center;
      }

      .letter p {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.6vw, 1.2rem);
        line-height: 2;
      }

      .floating-heart {
        position: fixed;
        right: clamp(1rem, 4vw, 3rem);
        bottom: clamp(1rem, 4vw, 3rem);
        width: 4rem;
        height: 4rem;
        border: 1px solid rgba(255, 206, 229, 0.28);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(63, 28, 58, 0.66);
        color: #ffd8e9;
        box-shadow: 0 18px 36px rgba(24, 8, 28, 0.28);
        backdrop-filter: blur(16px);
        animation: heartBeat 3s ease-in-out infinite;
      }

      .lightbox[hidden] {
        display: none;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: clamp(0.8rem, 3vw, 2rem);
      }

      .lightbox-backdrop {
        position: absolute;
        inset: 0;
        border: 0;
        background: rgba(13, 5, 15, 0.82);
        backdrop-filter: blur(18px);
        cursor: pointer;
      }

      .lightbox-panel {
        position: relative;
        z-index: 1;
        width: min(100%, 68rem);
        max-height: min(90vh, 56rem);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0.9rem;
      }

      .lightbox-bar,
      .lightbox-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
      }

      .lightbox-caption {
        color: #ffe1ef;
        font-weight: 800;
      }

      .lightbox-button {
        min-height: 2.8rem;
        border: 1px solid rgba(255, 212, 232, 0.28);
        border-radius: 999px;
        padding: 0.72rem 1rem;
        color: #fff7fb;
        background: rgba(63, 28, 58, 0.72);
        cursor: pointer;
      }

      .lightbox-figure {
        min-height: 0;
        margin: 0;
        border: 1px solid rgba(255, 212, 232, 0.2);
        border-radius: 1.35rem;
        overflow: hidden;
        background: rgba(21, 9, 24, 0.72);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }

      .lightbox-figure img {
        width: 100%;
        height: 100%;
        max-height: calc(90vh - 8.2rem);
        display: block;
        object-fit: contain;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.46;
        }

        50% {
          opacity: 0.86;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes heartBeat {
        0%,
        100% {
          transform: scale(1);
        }

        48% {
          transform: scale(1.08);
        }
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 1.2rem, 1080px);
          padding-top: 1rem;
        }

        .hero {
          min-height: auto;
          padding: 3.2rem 1.1rem 1.1rem;
          border-radius: 1.3rem;
        }

        .music-row {
          grid-template-columns: auto 1fr;
        }

        .music-toggle {
          grid-column: 1 / -1;
          width: 100%;
        }

        .section-heading {
          display: block;
        }

        .gallery-summary {
          width: fit-content;
          margin-top: 1rem;
        }

        .month-heading {
          display: block;
        }

        .month-count {
          display: block;
          margin-top: 0.35rem;
        }

        .photo-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.55rem;
        }

        .photo-card {
          border-radius: 0.82rem;
        }

        .lightbox {
          padding: 0.55rem;
        }

        .lightbox-panel {
          max-height: 94vh;
        }

        .lightbox-bar,
        .lightbox-actions {
          gap: 0.5rem;
        }

        .lightbox-button {
          padding: 0.68rem 0.82rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="生日礼物首页">
        <div class="hero-copy">
          <p class="eyebrow">A small birthday universe</p>
          <h1>生日快乐</h1>
          <p class="subtitle">
            我把 3 月到 7 月能找到的照片都放进来了。它们会在音乐里慢慢展开，像一封可以翻看的生日信。
          </p>
          <div class="hero-actions">
            <a class="button primary" href="#memories">先看看回忆</a>
            <button class="button" type="button" data-music-toggle>播放音乐</button>
          </div>
        </div>

        <section class="music-card" aria-label="背景音乐">
          <div class="music-row">
            <div class="disc" data-disc aria-hidden="true"></div>
            <div>
              <p class="music-title" data-track-title>古堡钢琴曲</p>
              <p class="music-state" data-music-state>如果浏览器拦截自动播放，点一下播放音乐就好。</p>
            </div>
            <button class="button music-toggle" type="button" data-music-toggle>播放</button>
          </div>
        </section>
      </section>

      <section class="section" id="memories" aria-label="照片回忆">
        <div class="section-heading">
          <div>
            <p class="eyebrow">March to July</p>
            <h2>这些日子都在这里</h2>
            <p>按月份把照片排好，点开任意一张就能慢慢翻。</p>
          </div>
          <div class="gallery-summary"><span data-photo-count>91</span> 张照片</div>
        </div>

        <div class="month-list" data-gallery></div>
      </section>

      <section class="letter" aria-label="生日祝福">
        <p class="eyebrow">To be continued</p>
        <h2>愿今天被温柔地记住</h2>
        <p>
          很多话可以之后再慢慢补上，但这些照片已经先替我们保存好了：一起出门、一起停下、一起把普通日子过成回忆。
        </p>
      </section>
    </main>

    <div class="floating-heart" aria-hidden="true">♥</div>

    <div class="lightbox" data-lightbox hidden aria-modal="true" role="dialog" aria-label="查看照片">
      <button class="lightbox-backdrop" type="button" data-lightbox-close aria-label="关闭照片"></button>
      <div class="lightbox-panel">
        <div class="lightbox-bar">
          <span class="lightbox-caption" data-lightbox-caption></span>
          <button class="lightbox-button" type="button" data-lightbox-close>关闭</button>
        </div>
        <figure class="lightbox-figure">
          <img data-lightbox-image src="" alt="" />
        </figure>
        <div class="lightbox-actions">
          <button class="lightbox-button" type="button" data-lightbox-prev>上一张</button>
          <button class="lightbox-button" type="button" data-lightbox-next>下一张</button>
        </div>
      </div>
    </div>

    <audio data-audio preload="auto"></audio>

    <script>
      const photoMonths = [
        { label: "3月", folder: "03", count: 12, note: "春天刚开始认真留下痕迹。" },
        { label: "4月", folder: "04", count: 10, note: "一些出门、停留和靠近的时刻。" },
        { label: "5月", folder: "05", count: 16, note: "照片变多了，记忆也变得更满。" },
        { label: "6月", folder: "06", count: 50, note: "六月像一整盒彩色碎片，被好好收了起来。" },
        { label: "7月", folder: "07", count: 3, note: "新的月份也已经开始写下来了。" },
      ];

      const gallery = document.querySelector("[data-gallery]");
      const photoCount = document.querySelector("[data-photo-count]");
      const lightbox = document.querySelector("[data-lightbox]");
      const lightboxImage = document.querySelector("[data-lightbox-image]");
      const lightboxCaption = document.querySelector("[data-lightbox-caption]");
      const closeLightboxButtons = Array.from(document.querySelectorAll("[data-lightbox-close]"));
      const prevPhotoButton = document.querySelector("[data-lightbox-prev]");
      const nextPhotoButton = document.querySelector("[data-lightbox-next]");

      const photos = photoMonths.flatMap((month) =>
        Array.from({ length: month.count }, (_, index) => {
          const number = String(index + 1).padStart(3, "0");
          return {
            month: month.label,
            monthCount: month.count,
            monthIndex: index + 1,
            src: `./photos/${month.folder}/${month.folder}-${number}.jpg`,
            alt: `${month.label}的第 ${index + 1} 张照片`,
          };
        }),
      );

      let activePhotoIndex = 0;

      function renderGallery() {
        photoCount.textContent = photos.length;
        gallery.innerHTML = photoMonths
          .map((month) => {
            const startIndex = photos.findIndex((photo) => photo.month === month.label);
            const cards = Array.from({ length: month.count }, (_, index) => {
              const photo = photos[startIndex + index];
              return `
                <button class="photo-card" type="button" data-photo-index="${startIndex + index}" aria-label="打开${photo.alt}">
                  <img src="${photo.src}" alt="${photo.alt}" loading="lazy" decoding="async" />
                </button>
              `;
            }).join("");

            return `
              <article class="month-block">
                <div class="month-heading">
                  <div>
                    <p class="eyebrow">${month.folder}</p>
                    <h3>${month.label}</h3>
                    <p>${month.note}</p>
                  </div>
                  <span class="month-count">${month.count} 张</span>
                </div>
                <div class="photo-grid">${cards}</div>
              </article>
            `;
          })
          .join("");
      }

      function showPhoto(index) {
        activePhotoIndex = (index + photos.length) % photos.length;
        const photo = photos[activePhotoIndex];
        lightboxImage.src = photo.src;
        lightboxImage.alt = photo.alt;
        lightboxCaption.textContent = `${photo.month} · 第 ${photo.monthIndex} / ${photo.monthCount} 张`;
        lightbox.hidden = false;
        document.body.classList.add("lightbox-open");
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImage.src = "";
        document.body.classList.remove("lightbox-open");
      }

      gallery.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-photo-index]");
        if (!trigger) {
          return;
        }
        showPhoto(Number(trigger.dataset.photoIndex));
      });

      closeLightboxButtons.forEach((button) => {
        button.addEventListener("click", closeLightbox);
      });

      prevPhotoButton.addEventListener("click", () => showPhoto(activePhotoIndex - 1));
      nextPhotoButton.addEventListener("click", () => showPhoto(activePhotoIndex + 1));

      document.addEventListener("keydown", (event) => {
        if (lightbox.hidden) {
          return;
        }

        if (event.key === "Escape") {
          closeLightbox();
        }

        if (event.key === "ArrowLeft") {
          showPhoto(activePhotoIndex - 1);
        }

        if (event.key === "ArrowRight") {
          showPhoto(activePhotoIndex + 1);
        }
      });

      const tracks = [
        { title: "古堡钢琴曲", src: "./audio/castle-piano.mp3" },
        { title: "梦境", src: "./audio/dream.ogg" },
      ];

      const audio = document.querySelector("[data-audio]");
      const title = document.querySelector("[data-track-title]");
      const state = document.querySelector("[data-music-state]");
      const disc = document.querySelector("[data-disc]");
      const toggles = Array.from(document.querySelectorAll("[data-music-toggle]"));
      let currentTrack = 0;

      function setTrack(index) {
        currentTrack = index % tracks.length;
        audio.src = tracks[currentTrack].src;
        title.textContent = tracks[currentTrack].title;
      }

      function setPlayingUi(isPlaying) {
        disc.classList.toggle("playing", isPlaying);
        toggles.forEach((button) => {
          button.textContent = isPlaying ? "暂停音乐" : "播放音乐";
        });
        state.textContent = isPlaying
          ? `正在播放：${tracks[currentTrack].title}`
          : "音乐已暂停，点一下可以继续。";
      }

      async function playMusic() {
        try {
          await audio.play();
          setPlayingUi(true);
        } catch {
          setPlayingUi(false);
          state.textContent = "浏览器需要你先点一下按钮，音乐就会开始。";
        }
      }

      function pauseMusic() {
        audio.pause();
        setPlayingUi(false);
      }

      toggles.forEach((button) => {
        button.addEventListener("click", () => {
          if (audio.paused) {
            playMusic();
          } else {
            pauseMusic();
          }
        });
      });

      audio.addEventListener("ended", () => {
        setTrack(currentTrack + 1);
        playMusic();
      });
